# COLORS
set -g @FOCUSED_INDEX_BG "#ea9a97"  # Rose (active highlight)
set -g @INDEX_BG "#9ccfd8"          # Foam (secondary accent)
set -g @TEXT_BG "#393552"           # Surface (elevated status bar background)
set -g @TEXT_DARK "#232136"         # Base (dark background for contrast text)
set -g @TEXT "#e0def4"              # Text (primary foreground)

# CONFIG
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
set -g base-index 1
set -g pane-base-index 1
set-option -sg escape-time 10
set -g status off
set-hook -g window-linked "if -F '#{==:#{session_windows},1}' 'set -g status off' 'set -g status on'"
set-hook -g window-unlinked "if -F '#{==:#{session_windows},1}' 'set -g status off' 'set -g status on'"
set-option -g status-position top
set -g visual-bell off
set -g status-left ""
set -g status-right ""
set -g status-style "bg=default"
set -g window-status-separator " "
set -g window-status-format "#[bg=#{@INDEX_BG},fg=#{@TEXT_DARK}] #I #[bg=#{@TEXT_BG},fg=#{@TEXT}] #W "
set -g window-status-current-format "#[bg=#{@FOCUSED_INDEX_BG},fg=#{@TEXT_DARK}] #I #[bg=#{@TEXT_BG},fg=#{@TEXT}] #W "
set -g pane-border-style "fg=#{@TEXT_BG}"
set -g pane-active-border-style "fg=#{@FOCUSED_INDEX_BG}"
set -g message-style "bg=#{@TEXT_BG},fg=#{@TEXT}"
set -g message-command-style "bg=#{@TEXT_BG},fg=#{@FOCUSED_INDEX_BG}"
set -g mode-style "bg=#{@INDEX_BG},fg=#{@TEXT_DARK}"
run-shell 'tmux set -g display-panes-colour "#{@INDEX_BG}"'
run-shell 'tmux set -g display-panes-active-colour "#{@FOCUSED_INDEX_BG}"'
set -g popup-border-style "fg=#{@TEXT_BG}"
set -g popup-border-lines "rounded"

# REMAP PREFIX
unbind C-b
set-option -g prefix M-e
bind-key M-e send-prefix

# REMAP WINDOW SELECT
bind-key -n M-z selectw -t 1
bind-key -n M-x selectw -t 2
bind-key -n M-c selectw -t 3
bind-key -n M-v selectw -t 4
bind-key -n M-b selectw -t 5

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind Up
unbind Down
unbind Left
unbind Right

# NEW WINDOW AND PANE AT CURRENT DIRECTORY
bind c new-window -c "#{pane_current_path}"
bind "/"  split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# POPUPS
bind-key -n M-t display-popup -d "#{pane_current_path}" -w 92% -h 92%
bind-key -n M-g display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "lazygit"
